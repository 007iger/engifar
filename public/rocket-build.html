<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>EngiFar | ロケット製作中</title>
  <link rel="stylesheet" href="./rocket-build.css?v=20260826-ui-port">
  <script type="module" src="./rocket-build.js?v=20260826-ui-port"></script>
</head>
<body>
  <main class="build-stage" aria-labelledby="build-title">
    <div class="build-stars" aria-hidden="true"></div>
    <section class="build-scene">
      <p class="build-eyebrow">CREW ASSEMBLY</p>
      <h1 id="build-title">ロケット製作中…</h1>
      <p id="build-status" aria-live="polite">みんなの知識を推進力へ変換しています</p>
      <div class="build-workshop" aria-hidden="true">
        <span class="build-orbit"></span>
        <div class="build-rocket"><i></i><b></b><span></span></div>
        <div class="build-bot build-bot--one"></div>
        <div class="build-bot build-bot--two"></div>
        <div class="build-bot build-bot--three"></div>
        <div class="build-bot build-bot--four"></div>
        <span class="build-spark build-spark--one">✦</span>
        <span class="build-spark build-spark--two">✦</span>
      </div>
      <div class="build-progress" aria-hidden="true"><i></i></div>
      <button id="build-skip" type="button">演出をスキップ</button>
    </section>
  </main>
</body>
</html>
